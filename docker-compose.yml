services:
  postgres:
    image: postgres:16-alpine
    container_name: tutortab-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tutortab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutortab}
      POSTGRES_DB: ${POSTGRES_DB:-tutortab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tutortab} -d ${POSTGRES_DB:-tutortab}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tutortab-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
